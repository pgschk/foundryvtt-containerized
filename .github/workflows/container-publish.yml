name: Container CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  FOUNDRYVTT_CONTAINERIZED_INSTALL_SUCCESS_EXPECTED: true
  IMAGES: |
    docker.io/pgschk/foundryvtt-containerized
    ghcr.io/pgschk/foundryvtt-containerized
  # Fork PRs get no secrets: build only, skip registry login, push and tests.
  IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

concurrency:
  group: container-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Add mask
        run: |
          echo "::add-mask::${{ secrets.CI_FOUNDRYVTT_DOWNLOAD_URL }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GHCR
        if: env.IS_FORK_PR != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.IS_FORK_PR != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: pgschk
          password: ${{ secrets.DOCKER_LOGIN }}

      - name: Docker Metadata
        id: docker-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGES }}
          tags: |
            type=edge
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build container image
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ env.IS_FORK_PR != 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}

    outputs:
      tags: ${{ steps.docker-metadata.outputs.tags }}
      digest: ${{ steps.build-image.outputs.digest }}
      pushed: ${{ env.IS_FORK_PR != 'true' }}

  test:
    needs: build
    if: ${{ needs.build.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # - name: Set image ENV
    #   shell: bash
    #   run: |
    #     echo "DOCKER_IMAGE= ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Pull image
      shell: bash
      run: |
        docker pull ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}

    # Run container-structure-test
    # https://github.com/marketplace/actions/container-structure-test-action
    - name: Run container-structure-tests
      uses: plexsystems/container-structure-test-action@c0a028aa96e8e82ae35be556040340cbb3e280ca # v0.3.0
      with:
        image: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        config: tests/container-structure-test/tests.yml

    # Run all available tests expecting sucessful installation
    - name: Run all tests
      run: FOUNDRYVTT_CONTAINERIZED_EXISTING_IMAGE=ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }} FOUNDRYVTT_DOWNLOAD_URL=${{ secrets.CI_FOUNDRYVTT_DOWNLOAD_URL }} ./tests/tests.sh

  sign:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: pgschk
          password: ${{ secrets.DOCKER_LOGIN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${DIGEST} docker.io/${{ github.repository }}@${DIGEST}
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: 1
