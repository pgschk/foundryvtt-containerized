name: Container CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  FOUNDRYVTT_CONTAINERIZED_INSTALL_SUCCESS_EXPECTED: true
  IMAGES: |
    docker.io/pgschk/foundryvtt-containerized
    ghcr.io/pgschk/foundryvtt-containerized
  # Fork PRs get no secrets: build only, skip registry login, push and tests.
  IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

concurrency:
  group: container-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Add mask
        run: |
          echo "::add-mask::${{ secrets.CI_FOUNDRYVTT_DOWNLOAD_URL }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GHCR
        if: env.IS_FORK_PR != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.IS_FORK_PR != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: pgschk
          password: ${{ secrets.DOCKER_LOGIN }}

      - name: Docker Metadata
        id: docker-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGES }}
          tags: |
            type=edge
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Install QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build container image
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ env.IS_FORK_PR != 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          # Attach an SBOM and build provenance to the pushed image
          sbom: true
          provenance: mode=max

    outputs:
      tags: ${{ steps.docker-metadata.outputs.tags }}
      digest: ${{ steps.build-image.outputs.digest }}
      pushed: ${{ env.IS_FORK_PR != 'true' }}

  test:
    needs: build
    if: ${{ needs.build.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Pull image
      shell: bash
      run: |
        docker pull ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}

    # Run container-structure-test
    # https://github.com/marketplace/actions/container-structure-test-action
    - name: Run container-structure-tests
      uses: plexsystems/container-structure-test-action@c0a028aa96e8e82ae35be556040340cbb3e280ca # v0.3.0
      with:
        image: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        config: tests/container-structure-test/tests.yml

    - name: Install QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    # The tests below run the amd64 image; this checks that the arm64 one starts
    - name: Smoke test arm64 image
      run: docker run --rm --platform linux/arm64 --entrypoint node "ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}" -v

    # Run all available tests expecting sucessful installation
    - name: Run all tests
      run: FOUNDRYVTT_CONTAINERIZED_EXISTING_IMAGE=ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }} FOUNDRYVTT_DOWNLOAD_URL=${{ secrets.CI_FOUNDRYVTT_DOWNLOAD_URL }} ./tests/tests.sh

  # Scans the image the build job pushed, instead of building it again
  scan:
    name: Trivy Vulnerability Scan
    needs: build
    if: ${{ needs.build.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
      TRIVY_EXIT_ON_EOL: '2'
      TRIVY_DISABLE_VEX_NOTICE: 'true'
      TRIVY_SHOW_SUPPRESSED: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          version: v0.76.2

      # Same scan as SARIF for the repository's Security tab
      - name: Run Trivy for code scanning
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          skip-setup-trivy: true
          version: v0.76.2
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      - name: Upload Trivy results
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  sign:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: pgschk
          password: ${{ secrets.DOCKER_LOGIN }}

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${DIGEST} docker.io/${{ github.repository }}@${DIGEST}
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: 1
